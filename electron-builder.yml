appId: com.claudecode.desktop
productName: Claude Code Desktop
# asar disabled: the Agent SDK spawns helper processes, which is simplest when
# node_modules are plain files on disk rather than inside an asar archive.
asar: false
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claude Code Desktop
